<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F8di — Programmer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0C0B08;
    --panel: #17140F;
    --panel-2: #1E1A13;
    --ink: #F5F1E6;
    --muted: #9C9384;
    --line: #2C2718;
    --yellow: #F4C21D;
    --yellow-dim: #7A6112;
    --yellow-deep: #C89A0A;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 0 26px;
  }

  h1, h2, h3{
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }

  .mono{ font-family: 'JetBrains Mono', monospace; }

  /* hazard stripe divider — signature element */
  .hazard{
    height: 10px;
    width: 100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0px, var(--yellow) 14px,
      #0C0B08 14px, #0C0B08 28px
    );
  }

  /* Nav */
  header{
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(12,11,8,0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 18px 0;
  }
  .logo{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  .logo span{ color: var(--yellow); }
  .navlinks{
    display:flex;
    gap: 26px;
    font-size: 14px;
    color: var(--muted);
  }
  .navlinks a{ transition: color .15s ease; }
  .navlinks a:hover, .navlinks a:focus-visible{ color: var(--yellow); }

  /* Hero */
  .hero{
    padding: 110px 0 64px;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--yellow);
    background: rgba(244,194,29,0.1);
    border: 1px solid var(--yellow-dim);
    padding: 5px 10px;
    border-radius: 3px;
    margin-bottom: 26px;
  }
  .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--yellow);
    flex-shrink: 0;
  }
  .hero-mark{
    font-weight: 700;
    font-size: clamp(64px, 13vw, 140px);
    line-height: 0.9;
    letter-spacing: -0.03em;
  }
  .hero-mark span{ color: var(--yellow); }
  .hero p.sub{
    margin-top: 24px;
    font-size: 17.5px;
    color: var(--muted);
    max-width: 540px;
  }
  .hero-links{
    display:flex;
    gap: 12px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 9px 14px;
    border-radius: 6px;
    transition: border-color .15s ease, color .15s ease;
  }
  .pill:hover, .pill:focus-visible{
    border-color: var(--yellow);
    color: var(--yellow);
  }

  /* Sections */
  section{ padding: 64px 0; }
  .section-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--yellow);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .section-title{
    font-size: 26px;
    margin-bottom: 30px;
  }

  /* About */
  .about-text{
    font-size: 16.5px;
    color: #D9D3C4;
    max-width: 640px;
    margin-bottom: 34px;
  }
  .about-text + .about-text{ margin-top: -20px; }

  .skills{
    display:flex;
    flex-wrap: wrap;
    gap: 9px;
  }
  .skill{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--yellow);
    background: rgba(244,194,29,0.08);
    border: 1px solid var(--yellow-dim);
    padding: 6px 11px;
    border-radius: 4px;
  }

  /* Contact */
  .contact-grid{
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 40px;
  }
  @media (max-width: 720px){
    .contact-grid{ grid-template-columns: 1fr; }
  }

  .contact-card{
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 22px;
    display:flex;
    flex-direction: column;
    gap: 16px;
  }
  .contact-channel{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-2);
    transition: border-color .15s ease;
  }
  .contact-channel:hover{ border-color: var(--yellow-dim); }
  .cc-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .cc-value{ font-size: 14.5px; }
  .cc-arrow{ color: var(--yellow); font-family: 'JetBrains Mono', monospace; }

  form{
    display:flex;
    flex-direction: column;
    gap: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 26px;
  }
  .field label{
    display:block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .field input, .field textarea{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 13px;
    border-radius: 6px;
    resize: vertical;
    transition: border-color .15s ease;
  }
  .field textarea{ min-height: 100px; }
  .field input:focus, .field textarea:focus{
    outline: none;
    border-color: var(--yellow);
  }
  .submit-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    background: var(--yellow);
    color: #171307;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  .submit-btn:hover{ background: var(--yellow-deep); }
  .submit-btn:disabled{ opacity: 0.6; cursor: not-allowed; }
  .form-status{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-height: 18px;
  }
  .form-status.ok{ color: #7FD98A; }
  .form-status.err{ color: #E67373; }

  footer{
    padding: 30px 0 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display:flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  footer .yellow{ color: var(--yellow); }

  :focus-visible{ outline: 2px solid var(--yellow); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
  }

  /* Custom scrollbar */
  html{
    scrollbar-width: thin;
    scrollbar-color: var(--yellow) var(--bg);
  }
  ::-webkit-scrollbar{
    width: 12px;
  }
  ::-webkit-scrollbar-track{
    background: var(--bg);
    border-left: 1px solid var(--line);
  }
  ::-webkit-scrollbar-thumb{
    background: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0px, var(--yellow) 5px,
      var(--yellow-deep) 5px, var(--yellow-deep) 10px
    );
    border: 2px solid var(--bg);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover{
    background: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0px, var(--yellow) 5px,
      #fff 5px, #fff 10px
    );
  }
  ::-webkit-scrollbar-corner{
    background: var(--bg);
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="logo">f8<span>di</span>.com</div>
      <div class="navlinks">
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 class="hero-mark">F8<span>di</span></h1>
    <p class="sub">I've worked on multiple scaled businesses alongside Roblox games.</p>
    <div class="hero-links">
      <span class="pill mono" style="color: var(--yellow); border-color: var(--yellow-dim);">Programmer</span>
      <a class="pill" href="https://www.roblox.com/users/4199299619/profile" target="_blank" rel="noopener">Roblox profile ↗</a>
      <a class="pill" href="https://discord.com/users/959655443578380288" target="_blank" rel="noopener">Discord ↗</a>
    </div>
    <div class="skills" style="margin-top: 30px;">
      <span class="skill">Luau</span>
      <span class="skill">Lua</span>
      <span class="skill">JavaScript</span>
      <span class="skill">TypeScript</span>
      <span class="skill">Python</span>
      <span class="skill">SQL</span>
      <span class="skill">Node.js</span>
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">Bash</span>
    </div>
  </div>
</section>

<div class="hazard"></div>

<section id="contact">
  <div class="wrap">
    <div class="section-label">Contact</div>
    <h2 class="section-title">Work with me</h2>

    <div class="contact-grid">
      <div class="contact-card">
        <a class="contact-channel" href="https://discord.com/users/959655443578380288" target="_blank" rel="noopener">
          <div>
            <div class="cc-label">Discord</div>
            <div class="cc-value">Message me</div>
          </div>
          <span class="cc-arrow">↗</span>
        </a>
        <a class="contact-channel" href="https://www.roblox.com/users/4199299619/profile" target="_blank" rel="noopener">
          <div>
            <div class="cc-label">Roblox</div>
            <div class="cc-value">View profile</div>
          </div>
          <span class="cc-arrow">↗</span>
        </a>
      </div>

      <form id="contact-form">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" required maxlength="80" placeholder="Jane Doe">
        </div>
        <div class="field">
          <label for="reach">Best way to reach you</label>
          <input type="text" id="reach" required maxlength="120" placeholder="Email, Discord handle, etc.">
        </div>
        <div class="field">
          <label for="reason">Why are you reaching out?</label>
          <textarea id="reason" required maxlength="1000" placeholder="Tell me a bit about what you need"></textarea>
        </div>
        <button class="submit-btn" type="submit" id="submit-btn">Send message</button>
        <div class="form-status" id="form-status"></div>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
    <span>© 2026 <span class="yellow">F8di</span></span>
    <span>f8di.com</span>
  </div>
</footer>

<script>
  const CONTACT_ENDPOINT = "/contact";

  const form = document.getElementById('contact-form');
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const reach = document.getElementById('reach').value.trim();
    const reason = document.getElementById('reason').value.trim();

    if(!name || !reach || !reason){
      status.textContent = "Please fill in every field.";
      status.className = "form-status err";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";
    status.textContent = "";
    status.className = "form-status";

    const payload = {
      username: "f8di.com contact form",
      embeds: [
        {
          title: "New contact form message",
          color: 16037917,
          fields: [
            { name: "Name", value: name, inline: true },
            { name: "Contact info", value: reach, inline: true },
            { name: "Reason", value: reason, inline: false }
          ],
          timestamp: new Date().toISOString()
        }
      ]
    };

    try{
      const res = await fetch(CONTACT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({ ok: false }));

      if(res.ok && data.ok){
        status.textContent = "Message sent — I'll get back to you soon.";
        status.className = "form-status ok";
        form.reset();
      } else {
        throw new Error("Proxy reported failure");
      }
    } catch(err){
      status.textContent = "Something went wrong sending that. Try reaching out on Discord instead.";
      status.className = "form-status err";
    } finally {
      btn.disabled = false;
      btn.textContent = "Send message";
    }
  });
</script>

</body>
</html>
