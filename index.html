<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F8di — Programmer</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e11;
  --panel: #16181d;
  --panel-border: #262930;
  --text-main: #f0f2f5;
  --text-muted: #8c94a0;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 0 24px;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(13, 14, 17, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--panel-border);
}

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
}

.logo {
  font-weight: 700;
  font-size: 18px;
}

.navlinks {
  display: flex;
  gap: 24px;
  font-size: 14px;
  color: var(--text-muted);
}

.navlinks a:hover {
  color: var(--text-main);
}

.view-count-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  padding: 3px 8px;
  border-radius: 999px;
  margin-left: 8px;
  vertical-align: middle;
}

.hero {
  padding: 96px 0 64px;
}

.hero-mark {
  font-weight: 700;
  font-size: clamp(48px, 10vw, 96px);
  line-height: 1;
  letter-spacing: -0.02em;
}

.hero p.sub {
  margin-top: 20px;
  font-size: 18px;
  color: var(--text-muted);
  max-width: 560px;
}

.hero-links {
  display: flex;
  gap: 12px;
  margin-top: 32px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-main);
  border: 1px solid var(--panel-border);
  background: var(--panel);
  padding: 8px 14px;
  border-radius: 6px;
  transition: border-color 0.15s ease;
}

.pill:hover {
  border-color: var(--accent);
}

.pill.badge {
  color: var(--accent);
  border-color: rgba(59, 130, 246, 0.3);
  background: rgba(59, 130, 246, 0.08);
}

section {
  padding: 48px 0 80px;
}

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.section-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 32px;
}

.skills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 32px;
}

.skill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--text-muted);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  padding: 6px 12px;
  border-radius: 6px;
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 32px;
}

@media(max-width: 720px) {
  .contact-grid {
    grid-template-columns: 1fr;
  }
}

.contact-card {
  border: 1px solid var(--panel-border);
  background: var(--panel);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.contact-channel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  background: var(--bg);
  transition: border-color 0.15s ease;
}

.contact-channel:hover {
  border-color: var(--accent);
}

.cc-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 2px;
}

.cc-value {
  font-size: 14px;
}

.cc-arrow {
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

form {
  display: flex;
  flex-direction: column;
  gap: 16px;
  border: 1px solid var(--panel-border);
  background: var(--panel);
  border-radius: 8px;
  padding: 24px;
}

.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.field input, .field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 10px 12px;
  border-radius: 6px;
  resize: vertical;
  transition: border-color 0.15s ease;
}

.field textarea {
  min-height: 100px;
}

.field input:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.submit-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s ease;
}

.submit-btn:hover {
  background: var(--accent-hover);
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.form-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  min-height: 18px;
}

.form-status.ok { color: #4ade80; }
.form-status.err { color: #f87171; }

footer {
  padding: 32px 0;
  border-top: 1px solid var(--panel-border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}

footer .footer-inner {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="logo">f8di.com <span class="view-count-tag" id="view-count-pill"><span id="view-count">5,321</span>&nbsp;views</span></div>
      <div class="navlinks">
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 class="hero-mark">F8di</h1>
    <p class="sub">I've scaled and programmed multiple businesses alongside Roblox games.</p>
    <div class="hero-links">
      <span class="pill badge">Programmer</span>
      <a class="pill" href="https://www.roblox.com/users/4199299619/profile" target="_blank" rel="noopener">Roblox profile ↗</a>
      <a class="pill" href="https://discord.com/users/959655443578380288" target="_blank" rel="noopener">Discord ↗</a>
    </div>
    <div class="skills">
      <span class="skill">Luau</span>
      <span class="skill">Lua</span>
      <span class="skill">JavaScript</span>
      <span class="skill">TypeScript</span>
      <span class="skill">Python</span>
      <span class="skill">SQL</span>
      <span class="skill">Node.js</span>
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">Bash</span>
    </div>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <div class="section-label">Contact</div>
    <h2 class="section-title">Work with me</h2>

    <div class="contact-grid">
      <div class="contact-card">
        <a class="contact-channel" href="https://discord.com/users/959655443578380288" target="_blank" rel="noopener">
          <div>
            <div class="cc-label">Discord</div>
            <div class="cc-value">Message me</div>
          </div>
          <span class="cc-arrow">↗</span>
        </a>

        <a class="contact-channel" href="https://www.roblox.com/users/4199299619/profile" target="_blank" rel="noopener">
          <div>
            <div class="cc-label">Roblox</div>
            <div class="cc-value">View profile</div>
          </div>
          <span class="cc-arrow">↗</span>
        </a>
      </div>

      <form id="contact-form">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" required maxlength="80" placeholder="Jane Doe">
        </div>

        <div class="field">
          <label for="reach">Best way to reach you</label>
          <input type="text" id="reach" required maxlength="120" placeholder="Email, Discord handle, etc.">
        </div>

        <div class="field">
          <label for="reason">Why are you reaching out?</label>
          <textarea id="reason" required maxlength="1000" placeholder="Tell me a bit about what you need"></textarea>
        </div>

        <button class="submit-btn" type="submit" id="submit-btn">Send message</button>

        <div class="form-status" id="form-status"></div>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 F8di</span>
    <span>f8di.com</span>
  </div>
</footer>

<script>
const CONTACT_ENDPOINT = "/contact";

const form = document.getElementById('contact-form');
const btn = document.getElementById('submit-btn');
const status = document.getElementById('form-status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const reach = document.getElementById('reach').value.trim();
  const reason = document.getElementById('reason').value.trim();

  if (!name || !reach || !reason) {
    status.textContent = "Please fill in every field.";
    status.className = "form-status err";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending...";
  status.textContent = "";
  status.className = "form-status";

  const payload = {
    username: "f8di.com contact form",
    embeds: [
      {
        title: "New contact form message",
        color: 3898870,
        fields: [
          { name: "Name", value: name, inline: true },
          { name: "Contact info", value: reach, inline: true },
          { name: "Reason", value: reason, inline: false }
        ],
        timestamp: new Date().toISOString()
      }
    ]
  };

  try {
    const res = await fetch(CONTACT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json().catch(() => ({ ok: false }));

    if (res.ok && data.ok) {
      status.textContent = "Message sent — I'll get back to you soon.";
      status.className = "form-status ok";
      form.reset();
    } else {
      throw new Error("Proxy reported failure");
    }
  } catch (err) {
    status.textContent = "Something went wrong sending that. Try reaching out on Discord instead.";
    status.className = "form-status err";
  } finally {
    btn.disabled = false;
    btn.textContent = "Send message";
  }
});
</script>

<script>
(function () {
  const VIEW_EPOCH = new Date('2026-08-19T00:00:00Z').getTime();
  const START_VIEWS = 5321;
  const MIN_INTERVAL_MS = 120000;
  const MAX_INTERVAL_MS = 180000;

  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function computeViews(nowMs) {
    if (nowMs <= VIEW_EPOCH) {
      return { total: START_VIEWS, nextTick: VIEW_EPOCH + MIN_INTERVAL_MS };
    }

    let total = START_VIEWS;
    let t = VIEW_EPOCH;
    let step = 0;

    while (true) {
      const intervalRng = mulberry32(step + 1);
      const interval = MIN_INTERVAL_MS + intervalRng() * (MAX_INTERVAL_MS - MIN_INTERVAL_MS);
      const nextT = t + interval;

      if (nextT > nowMs) {
        return { total, nextTick: nextT };
      }

      const incRng = mulberry32(step + 1000000);
      total += 1 + Math.floor(incRng() * 3);
      t = nextT;
      step++;
    }
  }

  const el = document.getElementById('view-count');
  if (!el) return;

  function render() {
    const now = Date.now();
    const { total, nextTick } = computeViews(now);
    el.textContent = total.toLocaleString();
    const delay = Math.max(1000, nextTick - now);
    setTimeout(render, delay);
  }

  render();
})();
</script>

</body>
</html>
