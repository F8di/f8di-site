<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="csrf-token" content="{{CSRF}}">
<title>F8di Stats</title>
<link rel="stylesheet" href="/stats/assets/app.css">
<script src="/stats/assets/app.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span><span>F8di Stats</span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button class="btn ghost sm" id="logout">Sign out</button></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn ghost sm menu" id="menu" aria-label="Menu">Menu</button>
      <h1 id="page-title">Overview</h1>
      <div class="top-actions">
        <div class="range" id="range"></div>
        <span class="updated" id="updated"></span>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main id="view" class="view"><div class="loading">Loading…</div></main>
  </div>
</div>
<div class="tooltip" id="tooltip" hidden></div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
