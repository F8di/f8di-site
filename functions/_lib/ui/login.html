<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · F8di Stats</title>
<style nonce="{{NONCE}}">
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% -10%,rgba(34,211,238,.12),transparent 60%),radial-gradient(900px 500px at 110% 110%,rgba(59,130,246,.12),transparent 60%),#05070a;color:#e6edf3;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(380px,92vw);background:rgba(13,17,23,.85);border:1px solid #1f2733;border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:in .4s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#3b82f6);box-shadow:0 0 12px #22d3ee}
.sub{color:#7d8794;font-size:13px;margin-bottom:24px}
label{display:block;font-size:12px;color:#9aa4b2;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #263041;background:#0a0e14;color:#e6edf3;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.15)}
button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.1)}
.err{margin-top:16px;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fca5a5;font-size:13px}
.foot{margin-top:18px;color:#5b6573;font-size:12px;text-align:center}
</style>
</head>
<body>
<form class="card" method="post" action="/stats/login" autocomplete="on">
  <div class="brand"><span class="dot"></span>F8di Stats</div>
  <div class="sub">Private dashboard. Owner sign-in only.</div>
  <input type="hidden" name="csrf" value="{{CSRF}}">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required maxlength="80" autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
  <label for="code">Authenticator code</label>
  <input id="code" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required maxlength="7" placeholder="123 456">
  <button type="submit">Sign in</button>
  {{ERROR}}
  <div class="foot">Sessions expire after 2 hours idle or 12 hours total.</div>
</form>
</body>
</html>
